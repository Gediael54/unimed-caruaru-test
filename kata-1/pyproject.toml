[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kata-1-triage-queue"
version = "0.1.0"
description = "Kata 1 da prova Unimed Caruaru: fila de triagem em Python."
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
