name: Kata 4

on:
  push:
    paths:
      - ".github/workflows/kata-4.yml"
      - "kata-4/**"
      - "scripts/**"
      - ".editorconfig"
      - ".gitattributes"
  pull_request:
    paths:
      - ".github/workflows/kata-4.yml"
      - "kata-4/**"
      - "scripts/**"
      - ".editorconfig"
      - ".gitattributes"

permissions:
  contents: read

jobs:
  validate-kata-4:
    name: Validate Kata 4
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Kata 4 validation
        run: bash scripts/kata.sh kata4 all
