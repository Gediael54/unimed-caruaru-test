[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kata-4-report-pipeline"
version = "0.1.0"
description = "Kata 4 da prova Unimed Caruaru: pipeline de consolidacao em Python."
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
